<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dashboard — SiAbsen</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="dashboard" hidden>
  <div class="app">
    <main>
      <section id="v-dashboard">
        <h1>Dashboard</h1>
        <p class="sub">Ringkasan kehadiran mahasiswa.</p>

        <div class="grid g4" id="stats"></div>

        <div class="grid g2" style="margin-top: 16px;">
          <div class="card">
            <h2>Kehadiran per pertemuan (%)</h2>
            <div class="chartbox"><canvas id="c1"></canvas></div>
          </div>

          <div class="card">
            <h2>⚠ Kehadiran di bawah 75%</h2>
            <div id="warn"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="js/script.js"></script>
</body>

</html>
